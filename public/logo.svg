<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Truck Icon -->
  <g transform="translate(50, 70)">
    <!-- Truck Body -->
    <rect x="0" y="20" width="60" height="30" fill="white" rx="2"/>
    <!-- Truck Cab -->
    <rect x="60" y="10" width="30" height="40" fill="white" rx="2"/>
    <!-- Wheels -->
    <circle cx="15" cy="52" r="8" fill="#1e40af" stroke="white" stroke-width="2"/>
    <circle cx="75" cy="52" r="8" fill="#1e40af" stroke="white" stroke-width="2"/>
    <!-- Window -->
    <rect x="65" y="15" width="20" height="15" fill="#93c5fd" rx="1"/>
  </g>
  
  <!-- Gear/Parts Icon -->
  <g transform="translate(135, 120)">
    <circle cx="0" cy="0" r="15" fill="white" stroke="#1e40af" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#1e40af" stroke-width="2"/>
    <!-- Gear teeth -->
    <rect x="-2" y="-18" width="4" height="6" fill="white"/>
    <rect x="-2" y="12" width="4" height="6" fill="white"/>
    <rect x="-18" y="-2" width="6" height="4" fill="white"/>
    <rect x="12" y="-2" width="6" height="4" fill="white"/>
  </g>
</svg>